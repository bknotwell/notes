name: Publish Org-roam Site

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Set permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: 31.1

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages:  |
            any::ggplot2
            any::scales

      - name: Install SQLite
        run: |
           sudo apt-get update
           sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Download and Extract Kaggle Dataset
        env:
          KAGGLE_SECRET: ${{ secrets.KAGGLE }}
        run: |
          # 1. Extract credentials from the JSON secret and encode to Base64
          AUTH=$(echo "$KAGGLE_SECRET" | jq -r '"\(.username):\(.key)"' | base64 -w 0)

          # 2. Set API variables
          USER='piterfm'
          DATASET='2022-ukraine-russian-war'
          ENDPOINT='https://www.kaggle.com/api/v1/datasets/download'

          # 3. Get the redirect download URL
          REDIR=$(curl -s -H "Authorization: Basic $AUTH" "$ENDPOINT/$USER/$DATASET" --write-out "%{redirect_url}" -o /dev/null)

          # 4. Download and unzip the dataset
          curl -sL "$REDIR" -o dataset.zip
          unzip dataset.zip
          rm dataset.zip

      - name: Install Packages and Publish Site
        run: |
          emacs --batch -l publish.el

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name:  github-pages
      url:  $$`{{ steps.deployment.outputs.page_url }}
    steps:
       - name: Deploy to GitHub Pages
         id: deployment
         uses: actions/deploy-pages@v5
